<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozan Taysi (Siyah) – E-Ticaret ve Dijital Sistemler Uzmanı</title>
<style>
  :root{
    --bg:#f6f8fc; --card:#ffffff; --ink:#1f1f23; --muted:#575b66; --line:#e3e7ef;
    --blue:#d3e3fd; --blue-ink:#0b4dbb;
    --green:#c9efd5; --green-ink:#0d5c2b;
    --yellow:#fde9a8; --yellow-ink:#6b4c00;
    --pink:#fbd5d1; --pink-ink:#9c1c14;
    --lav:#e6dcfa; --lav-ink:#4a2a9a;
    --r:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:90px}
  body{
    font-family:"Google Sans","Product Sans","Segoe UI","Helvetica Neue",Arial,"Liberation Sans",sans-serif;
    background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
  section{padding:clamp(36px,6vw,72px) 0}
  /* nav */
  .top{position:fixed;top:14px;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
  .pill-nav{
    pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:999px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
    border:1px solid var(--line);box-shadow:0 4px 18px rgba(31,31,35,.08);
  }
  .pill-nav a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 16px;border-radius:999px;color:var(--muted)}
  .pill-nav a:hover{background:var(--bg);color:var(--ink)}
  .pill-nav a[aria-current="true"]{background:var(--ink);color:#fff}
  .pill-nav a:focus-visible,.btn:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
  /* hero */
  .hero{padding-top:clamp(96px,14vh,140px)}
  .hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
  .chip{
    display:inline-block;padding:7px 16px;border-radius:999px;font-weight:600;font-size:.9rem;
    background:var(--blue);color:var(--blue-ink);
  }
  h1{font-size:clamp(2.8rem,8vw,5.6rem);line-height:1;font-weight:700;letter-spacing:-.03em;margin:.3em 0 .15em}
  .role{font-size:clamp(1.25rem,2.6vw,1.8rem);font-weight:600;color:var(--blue-ink);letter-spacing:-.01em}
  .intro{margin-top:.9em;max-width:46ch;color:var(--muted);font-size:1.1rem}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:1.6em}
  .btn{
    display:inline-block;text-decoration:none;font-weight:600;font-size:1rem;
    padding:14px 26px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);background:transparent;
  }
  .btn.solid{background:var(--ink);color:#fff}
  .btn:hover{transform:translateY(-1px)}
  .portrait{position:relative;justify-self:center;width:min(100%,400px);aspect-ratio:1}
  .portrait::before,.portrait::after{content:"";position:absolute;border-radius:50%;z-index:0}
  .portrait::before{width:46%;height:46%;background:var(--yellow);top:-6%;right:-4%}
  .portrait::after{width:34%;height:34%;background:var(--green);bottom:-4%;left:-6%}
  .portrait .frame{position:relative;z-index:1;width:100%;height:100%;border-radius:38% 62% 55% 45% / 45% 40% 60% 55%;overflow:hidden;background:var(--lav);border:6px solid #fff;box-shadow:0 10px 30px rgba(31,31,35,.12)}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  
  /* Ortalanmış bilgi / istatistik bölümü */
  .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:2em}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 18px;text-align:center}
  .fact b{display:block;font-size:1.15rem}
  .fact span{font-size:.82rem;color:var(--muted)}
  
  /* headings */
  h2{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-bottom:.35em}
  .sub{color:var(--muted);max-width:60ch;margin-bottom:1.6em;font-size:1.08rem}
  /* cards */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{border-radius:var(--r);padding:clamp(20px,3vw,30px)}
  .card h3{font-size:1.3rem;line-height:1.2;margin-bottom:.5em}
  .card p{font-size:1rem}
  .c-blue{background:var(--blue);color:#0c2a5c}
  .c-green{background:var(--green);color:#0b3a1c}
  .c-yellow{background:var(--yellow);color:#4a3500}
  .c-pink{background:var(--pink);color:#5e120d}
  .c-lav{background:var(--lav);color:#2d1a63}
  .dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-bottom:.9em}
  .c-blue .dot{background:var(--blue-ink)} .c-green .dot{background:var(--green-ink)} .c-yellow .dot{background:var(--yellow-ink)}
  .bridge{margin-top:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:22px 28px;font-size:1.1rem;font-weight:500}
  /* skills */
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .sk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
  .sk h3{font-size:1.05rem;margin-bottom:.8em}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:.88rem;font-weight:500;padding:6px 12px;border-radius:999px;line-height:1.3}
  .sk.b .tag{background:var(--blue);color:#0c2a5c}
  .sk.g .tag{background:var(--green);color:#0b3a1c}
  .sk.y .tag{background:var(--yellow);color:#4a3500}
  .sk.l .tag{background:var(--lav);color:#2d1a63}
  /* timeline */
  .jobs{display:flex;flex-direction:column;gap:14px}
  .job{display:grid;grid-template-columns:150px 1fr;gap:6px 24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,2.5vw,26px)}
  .yr{display:inline-block;align-self:start;justify-self:start;font-weight:700;font-size:.92rem;padding:6px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
  .job.now .yr{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .job .co{font-size:1.18rem;font-weight:700}
  .job .ti{color:var(--blue-ink);font-weight:600;font-size:.98rem}
  .job .ds{color:var(--muted);font-size:.98rem;margin-top:.25em;max-width:70ch}
  /* contact */
  .contact{background:var(--ink);color:#fff;border-radius:40px;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(20px,4vw,48px)}
  .contact h2{color:#fff}
  .contact p{color:#d4d7df}
  .contact a.l{color:#fff}
  .contact .btn{border-color:#fff;color:#fff}
  .contact .btn.solid{background:#fff;color:var(--ink)}
  .contact h3{font-size:1rem;color:#a9c7ff;margin-bottom:.5em}
  .contact .col p{margin-bottom:.5em}
  footer{padding:24px 0 48px;color:var(--muted);font-size:.88rem;text-align:center}
  @media (max-width:900px){
    body{font-size:16px}
    .hero-grid{grid-template-columns:1fr}
    .portrait{width:min(70%,300px);order:-1;justify-self:start}
    .grid3{grid-template-columns:1fr}
    .grid4{grid-template-columns:1fr 1fr}
    .job{grid-template-columns:1fr}
    .contact{grid-template-columns:1fr}
    .pill-nav a{padding:7px 9px;font-size:.78rem}
    .hero{padding-top:92px}
  }
  @media (max-width:520px){.grid4{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:hover{transform:none}}

  .pill-nav a[aria-current="true"]{background:#f1f3f6;color:#0a0b0e}
  .pill-nav a:focus-visible,.btn:focus-visible{outline-color:#8ab4f8
